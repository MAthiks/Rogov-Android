name: Android APK — ROGOV

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK platform
        shell: bash
        run: |
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::Android sdkmanager not found in $SDKROOT"
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDKROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDKROOT" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Unit tests + debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Publish downloadable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ROGOV-0.1.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
