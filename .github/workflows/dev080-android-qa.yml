name: DEV-080 — Android 13 Chrome QA
on:
  pull_request:
    paths:
      - "docs/**"
      - "tests/android-emulator-browser.test.mjs"
      - "tools/smoke-android-web.sh"
      - "tools/make-icons.mjs"
      - "package.json"
      - ".github/workflows/dev080-android-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare actual PWA assets and Chrome DevTools test runner
        run: |
          node tools/make-icons.mjs
          npm install --no-save playwright@1.56.0
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test actual Chrome on Android 13 (not native compatibility APK)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_3a
          ram-size: 3072M
          heap-size: 512M
          disable-animations: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/smoke-android-web.sh
      - name: Save Android Chrome PWA screenshot for visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev080-android13-chrome-qa
          path: |
            rogov-dev080-android13.png
            rogov-android-onboarding.png
          if-no-files-found: ignore
          retention-days: 14
