name: DEV-080 — PR validation
on:
  pull_request:
    paths:
      - "docs/**"
      - "tests/**"
      - "package.json"
      - "tools/balance-lab.mjs"
      - "tools/expedition-audit.mjs"
      - "tools/pressure-audit.mjs"
      - "tools/tech108-audit.mjs"
      - "tools/tech108b-inventory.mjs"
      - "tools/tech108b4-assets.mjs"
      - "tools/tech108c1-docs.mjs"
      - ".github/workflows/dev080-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and gameplay regression tests
        run: |
          npm run check:web
          npm run test:web
      - name: TECH-108A — Read-only source and resource reference audit
        shell: bash
        run: |
          node tools/make-icons.mjs
          set -o pipefail
          node tools/tech108-audit.mjs --check | tee tech108a-baseline.json
      - name: Archive TECH-108A baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tech108a-baseline
          path: tech108a-baseline.json
          if-no-files-found: warn
          retention-days: 30
      - name: TECH-108B1 — Read-only CSS and JS entrypoint graph
        shell: bash
        run: |
          set -o pipefail
          node tools/tech108b-inventory.mjs --check | tee tech108b1-entrypoints.json
      - name: Archive TECH-108B1 entrypoint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tech108b1-entrypoints
          path: tech108b1-entrypoints.json
          if-no-files-found: warn
          retention-days: 30
      - name: TECH-108B4 — Read-only visual files, generated icons and sprite providers
        shell: bash
        run: |
          node tools/make-icons.mjs
          set -o pipefail
          node tools/tech108b4-assets.mjs --check | tee tech108b4-assets.json
      - name: Archive TECH-108B4 visual asset evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tech108b4-assets
          path: tech108b4-assets.json
          if-no-files-found: warn
          retention-days: 30
      - name: TECH-108C1 — Inventory of tracked Markdown and internal references
        shell: bash
        run: |
          set -o pipefail
          node tools/tech108c1-docs.mjs --check | tee tech108c1-doc-links.json
      - name: Archive TECH-108C1 documentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tech108c1-doc-links
          path: tech108c1-doc-links.json
          if-no-files-found: warn
          retention-days: 30
      - name: GAME-095D1 — 100 seeded three-floor expedition surveys and isolated duels
        run: |
          set -euo pipefail
          node tools/balance-lab.mjs --count 100 --start 2 | tee game095d1-balance-baseline.json
          node -e 'const fs=require("node:fs"); const r=JSON.parse(fs.readFileSync("game095d1-balance-baseline.json","utf8")); if(r.expeditionSamples!==100||r.generatedFloors!==300||r.floors.length!==3)process.exit(1);'
      - name: Publish reproducible balance baseline (NOT human playtest results)
        uses: actions/upload-artifact@v4
        with:
          name: game095d1-balance-baseline-100
          path: game095d1-balance-baseline.json
          retention-days: 21
      - name: GAME-095D3 — scripted engine-action expedition audit
        run: |
          set -euo pipefail
          node tools/expedition-audit.mjs --count=6 --start=2 --max-actions=440 | tee game095d3-expedition-audit.json
          node -e 'const fs=require("node:fs"); const r=JSON.parse(fs.readFileSync("game095d3-expedition-audit.json","utf8")); if(r.auditVersion!==2||r.expeditionSeeds!==6||r.engineActionTrials!==12||r.trials.some(t=>t.outcome.startsWith("invalid_")||t.pressureByFloor?.length!==3||t.pressureByFloor.reduce((s,f)=>s+f.observedTurns,0)!==t.actualTurns)||Object.values(r.policies).some(p=>p.byFloor.length!==3))process.exit(1);'
      - name: Publish action-based resource audit (NOT human playtest results)
        uses: actions/upload-artifact@v4
        with:
          name: game095d3-expedition-actions-6
          path: game095d3-expedition-audit.json
          retention-days: 21
      - name: Install isolated Chromium test runner
        run: |
          npm install --no-save playwright@1.56.0
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
            echo 'ROGOV_USE_SYSTEM_CHROME=1' >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Android portrait browser interactions and offline cache
        run: node --test tests/mobile-browser.test.mjs
      - name: Archive QA-096 Chromium screenshots and layout metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa096-chromium-portraits
          path: qa096-screenshots/
          if-no-files-found: warn
          retention-days: 14
