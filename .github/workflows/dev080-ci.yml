name: DEV-080 — PR validation
on:
  pull_request:
    paths:
      - "docs/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/dev080-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and gameplay regression tests
        run: |
          npm run check:web
          npm run test:web
