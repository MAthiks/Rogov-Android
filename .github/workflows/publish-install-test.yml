name: Publish ROGOV compatibility APK

on:
  push:
    paths:
      - '.github/workflows/publish-install-test.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download Android-13 tested compatibility APK
        uses: actions/download-artifact@v4
        with:
          name: ROGOV-0.1.3-compat-android13-tested-apk
          run-id: 44108577480
          github-token: ${{ github.token }}
          path: dist
      - name: Prepare direct APK download
        shell: bash
        run: |
          APK=$(find dist -type f -name 'app-debug.apk' -print -quit)
          test -n "$APK"
          cp "$APK" dist/ROGOV-v0.1.3-COMPAT.apk
          sha256sum dist/ROGOV-v0.1.3-COMPAT.apk
      - name: Publish compatibility release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.3-compat dist/ROGOV-v0.1.3-COMPAT.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "ROGOV v0.1.3 — COMPAT Android 13" \
            --notes "Version de diagnostic originale, testée par installation et démarrage sur émulateur Android 13. Application ID : com.rogov.android.compat. Target SDK 33. Signatures APK v1 et v2. Elle n'écrase pas les anciennes installations. Télécharger le .apk directement. Si l'installation refuse encore sur votre téléphone, relever le code d'erreur via le système d'installation ou ADB, la source de l'APK et le stockage disponible. Ne pas désactiver les protections système pour forcer l'installation."
