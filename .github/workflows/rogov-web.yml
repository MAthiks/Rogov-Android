name: ROGOV Web — Tests and GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tests/web-game.test.mjs"
      - "tools/make-icons.mjs"
      - "package.json"
      - ".github/workflows/rogov-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rogov-web-pages
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JavaScript and run gameplay tests
        run: |
          npm run check:web
          npm run test:web
      - name: Create PWA icons
        run: node tools/make-icons.mjs
      - name: Upload static web application
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./docs"

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
