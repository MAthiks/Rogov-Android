name: APK-098A — Current PWA WebView Android

on:
  pull_request:
    paths:
      - "webapp/**"
      - "docs/**"
      - "tests/webapk-*.mjs"
      - "tools/smoke-webapk.sh"
      - "settings.gradle.kts"
      - ".github/workflows/webapk-qa.yml"
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - "docs/**"
      - "tests/webapk-*.mjs"
      - "settings.gradle.kts"
      - ".github/workflows/webapk-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modern-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android SDK 36
        shell: bash
        run: |
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDKROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDKROOT" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify no fork of Web game and build separately signed debug APK
        run: |
          node --test tests/webapk-parity.test.mjs
          gradle --no-daemon :webapp:assembleDebug
          "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0/apksigner" verify --verbose webapp/build/outputs/apk/debug/webapp-debug.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and use full modern ROGOV offline on Android 13
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          # Android 13 automated-test AOSP image: no unstable GMS FontsProvider.
          # It is lighter than the full AOSP image, which lost its ADB session
          # during WebView rendering on the GitHub runner. Chrome's Google APIs
          # emulator remains independently validated in dev080-android-qa.yml.
          target: aosp_atd
          arch: x86_64
          profile: pixel_3a
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # Hard deadline also covers a disconnected ADB session. A timeout is
          # an explicit failure, never an implicit pass.
          script: timeout --signal=TERM --kill-after=10s 240s bash tools/smoke-webapk.sh
      - name: Archive independent modern debug APK and actual Android screenshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ROGOV-modern-web-0.7f-qa098a-android13-apk
          path: |
            webapp/build/outputs/apk/debug/webapp-debug.apk
            rogov-webapk-qa098a.png
            rogov-webapk-qa098a-nhal.png
            rogov-webapk-ui098b1-bag.png
          if-no-files-found: error
          retention-days: 30

      # PR-specific package prevents a debug-signature mismatch from risking
      # deletion of the existing WebView save. Test original APK above first.
      - name: Assemble safely installable side-by-side PR test APK
        if: success() && github.event_name == 'pull_request'
        shell: bash
        run: |
          PR="${{ github.event.pull_request.number }}"
          gradle --no-daemon -ProgovQaAppSuffix=".pr${PR}" :webapp:clean :webapp:assembleDebug
          APK="webapp/build/outputs/apk/debug/webapp-debug.apk"
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDKROOT/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$SDKROOT/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.rogov.webapk.pr${PR}'"
          "$SDKROOT/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "application-label:'ROGOV TEST PR ${PR}'"
          cp "$APK" "rogov-pr${PR}-side-by-side.apk"
      - name: Archive side-by-side PR APK (no save deletion required)
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ROGOV-PR-${{ github.event.pull_request.number }}-side-by-side-Android
          path: rogov-pr*-side-by-side.apk
          if-no-files-found: error
          retention-days: 30
