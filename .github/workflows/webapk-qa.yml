name: APK-098A — Current PWA WebView Android

on:
  pull_request:
    paths:
      - "webapp/**"
      - "docs/**"
      - "tests/webapk-*.mjs"
      - "tools/smoke-webapk.sh"
      - "settings.gradle.kts"
      - ".github/workflows/webapk-qa.yml"
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - "docs/**"
      - "tests/webapk-*.mjs"
      - "settings.gradle.kts"
      - ".github/workflows/webapk-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modern-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android SDK 36
        shell: bash
        run: |
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDKROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDKROOT" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify no fork of Web game and build separately signed debug APK
        run: |
          node --test tests/webapk-parity.test.mjs
          gradle --no-daemon :webapp:assembleDebug
          "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0/apksigner" verify --verbose webapp/build/outputs/apk/debug/webapp-debug.apk
      - name: Install Android WebView CDP test runner
        run: npm install --no-save playwright@1.56.0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and use full modern ROGOV offline on Android 13
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          ram-size: 3072M
          heap-size: 512M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/smoke-webapk.sh
      - name: Archive independent modern debug APK and actual Android screenshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ROGOV-modern-web-0.7f-qa098a-android13-apk
          path: |
            webapp/build/outputs/apk/debug/webapp-debug.apk
            rogov-webapk-qa098a.png
            rogov-webapk-qa098a-nhal.png
          if-no-files-found: error
          retention-days: 30
