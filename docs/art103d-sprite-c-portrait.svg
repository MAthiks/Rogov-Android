<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 112" width="96" height="112" shape-rendering="crispEdges" aria-hidden="true">
<!-- ART-103D: Original portrait translation of Sprite C's hood-up palette.
     Decorative character art; never a stat, selectable item or gameplay clue. -->
<defs>
  <linearGradient id="night" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#0b1721"/>
    <stop offset=".55" stop-color="#1a2830"/>
    <stop offset="1" stop-color="#121820"/>
  </linearGradient>
  <linearGradient id="cloak" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#69565d"/>
    <stop offset=".5" stop-color="#443943"/>
    <stop offset="1" stop-color="#292c36"/>
  </linearGradient>
  <linearGradient id="hood" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#79636c"/>
    <stop offset=".48" stop-color="#463945"/>
    <stop offset="1" stop-color="#292732"/>
  </linearGradient>
  <radialGradient id="torch">
    <stop offset="0" stop-color="#efad60" stop-opacity=".26"/>
    <stop offset="1" stop-color="#ae7047" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="96" height="112" fill="url(#night)"/>
